[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceframe"
version = "0.1.0"
description = "Real-time adaptive camera framing prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # mediapipe pulls in opencv-contrib-python, which provides cv2 with GUI
    # support. Do NOT also install opencv-python / opencv-python-headless:
    # they overwrite the same cv2 module and break cv2.imshow.
    "mediapipe>=1.2.3,<2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
faceframe = "faceframe.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
